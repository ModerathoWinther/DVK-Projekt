midas-local:
  env_make_params:
    split: "train"
    num_trades: 5
    atr: true
    macd: true
    rsi: true
    initial_capital: 10000.0
    transaction_cost: 0.0002
    data_format: "wick"
    episode_length: 5000
    is_buy_hold: False
  validation:
    val_frequency_episode: 10
    val_episodes: 5
    save_best_metric: "sharpe"
    deterministic: True
    epsilon: 0.025
  live_test:
    time_start: "2026-05-01 08:15:00"
    time_frame_minute_size: 1
    test_minute_length: 2
    trading_volume: 0.1
    port: 8001
    is_containerized: False
    num_tests: 1
  env_id: 'midas-local'
  learning_rate_a: 0.0001
  epsilon_init: 1.0
  epsilon_decay: 0.999997
  epsilon_min: 0.05
  discount_factor_g: 0.999
  fc1_nodes: 512
  replay_memory_size: 1000000
  network_sync_rate: 25000
  enable_double_dqn: true
  enable_dueling_dqn: true
  min_buffer_fill: 10000
  mini_batch_size: 256
  max_episodes: 500

